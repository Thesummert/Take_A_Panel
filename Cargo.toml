[package]
name = "take-a-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A small cross-platform application launcher built with Rust and Slint"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
anyhow = "1"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "unstable-winit-030"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSWorkspace", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSString", "NSData", "NSDictionary", "NSGeometry"] }

[target.'cfg(target_os = "linux")'.dependencies]
freedesktop-icons = "0.4"
resvg = { version = "0.48", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Com"] }
windows = { version = "0.62", features = ["Win32_UI_Shell", "Win32_System_Com", "Win32_Graphics_Gdi", "Win32_Foundation"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
freedesktop-icons = "0.4"
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
png = "0.18"
resvg = { version = "0.48", default-features = false }

[profile.release]
lto = "thin"
strip = true
