[package]
name = "take-a-panel"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "A small cross-platform application launcher built with Rust and Slint"
license = "GPL-3.0-only"
build = "build.rs"

[dependencies]
anyhow = "1"
global-hotkey = "0.8"
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-18", "unstable-winit-030"] }
walkdir = "2"

[target.'cfg(target_os = "macos")'.dependencies]
plist = "1"

[target.'cfg(target_os = "windows")'.dependencies]
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_Com"] }

[build-dependencies]
slint-build = "=1.18.1"

[dev-dependencies]
i-slint-backend-testing = { version = "=1.18.1", features = ["renderer-software"] }
png = "0.18"

[profile.release]
lto = "thin"
strip = true
